name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: '1.92.0'
          components: rustfmt, clippy
      - name: Install Ansible for the actual executor regression test
        run: |
          umask 077
          mkdir -p .generated/tmp
          python3 -m venv .generated/ansible
          TMPDIR="$PWD/.generated/tmp" .generated/ansible/bin/pip install 'ansible-core==2.20.4'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
        env:
          CMDMESH_TEST_ANSIBLE: ${{ github.workspace }}/.generated/ansible/bin/ansible-playbook
          TMPDIR: ${{ github.workspace }}/.generated/tmp
      - run: cargo build --locked --release
